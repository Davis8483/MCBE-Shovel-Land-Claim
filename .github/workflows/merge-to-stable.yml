name: Merge BP and RP to Stable (via PR)
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      bp_branch:
        description: 'BP branch to merge'
        required: true
        default: 'development-BP'
        type: string
      rp_branch:
        description: 'RP branch to merge'
        required: true
        default: 'development-RP'
        type: string
      release_tag:
        description: 'Release tag (e.g., v1.0.0, v2.1.3)'
        required: true
        default: 'v1.0.0'
        type: string
      include_history:
        description: 'Include full commit history from branches'
        required: true
        default: false
        type: boolean
      release_notes:
        description: 'Release notes for this merge'
        required: false
        type: string

jobs:
  merge-to-pr:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Checkout stable branch
      run: |
        git checkout stable
        git pull origin stable

    - name: Remove existing BP and RP directories
      run: |
        if [ -d "BP" ]; then
          git rm -rf BP
        fi
        if [ -d "RP" ]; then
          git rm -rf RP
        fi
        git commit -m "Remove old BP and RP directories before merge" || echo "No changes to commit"

    - name: Add BP content as subtree
      run: |
        if [ "${{ github.event.inputs.include_history }}" = "true" ]; then
          git subtree add --prefix=BP origin/${{ github.event.inputs.bp_branch }} -m "Merge ${{ github.event.inputs.bp_branch }} as BP subtree (with history)"
        else
          git subtree add --prefix=BP origin/${{ github.event.inputs.bp_branch }} --squash -m "Merge ${{ github.event.inputs.bp_branch }} as BP subtree (squashed)"
        fi

    - name: Add RP content as subtree
      run: |
        if [ "${{ github.event.inputs.include_history }}" = "true" ]; then
          git subtree add --prefix=RP origin/${{ github.event.inputs.rp_branch }} -m "Merge ${{ github.event.inputs.rp_branch }} as RP subtree (with history)"
        else
          git subtree add --prefix=RP origin/${{ github.event.inputs.rp_branch }} --squash -m "Merge ${{ github.event.inputs.rp_branch }} as RP subtree (squashed)"
        fi

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        base: stable
        branch: "merge-release"
        branch-suffix: random
        title: "Release: ${{ github.event.inputs.release_tag }}"
        body: "${{ github.event.inputs.release_notes }}"

    - name: Create release tag
      run: |
        TAG="${{ github.event.inputs.release_tag }}"
        
        RELEASE_BODY="Release $TAG - Automated merge from BP and RP branches"
        if [ -n "${{ github.event.inputs.release_notes }}" ]; then
          RELEASE_BODY="${RELEASE_BODY}

        ${{ github.event.inputs.release_notes }}"
        fi
        
        git tag -a "${TAG}" -m "${RELEASE_BODY}"
        git push origin "${TAG}"
        
        echo "Created release tag: ${TAG}"
